<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>كشف جرد المستودع - {{ count_session_id }}</title>
  <style>
    @page { size: A4 portrait; margin: 12mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 13px; color: #111; line-height: 1.4; }
    .header { text-align: center; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-bottom: 16px; }
    .title { font-size: 18px; font-weight: 800; }
    .sub { font-size: 12px; color: #64748b; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12px; }
    th { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 7px 8px; text-align: right; }
    td { border: 1px solid #e2e8f0; padding: 6px 8px; }
    .num { font-family: 'Courier New', monospace; font-weight: 600; text-align: left; direction: ltr; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">استمارة الجرد الفعلي للمخزون (Physical Inventory Count Sheet)</div>
    <div class="sub">{{ company_name }} | المستودع: {{ warehouse_name }} | تاريخ الجرد: {{ count_date }}</div>
  </div>
  <table>
    <thead>
      <tr>
        <th style="width: 30px;">#</th>
        <th style="width: 120px;">الباركود / الكود</th>
        <th>اسم الصنف</th>
        <th style="width: 80px; text-align: center;">الرصيد الدفتري</th>
        <th style="width: 90px; text-align: center;">العد الفعلي</th>
        <th style="width: 80px; text-align: center;">الفارق (+/-)</th>
        <th>ملاحظات الجرد</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="text-align: center;">1</td>
        <td class="num">{{ item_1_sku }}</td>
        <td><strong>{{ item_1_name }}</strong></td>
        <td class="num" style="text-align: center;">{{ item_1_system_qty }}</td>
        <td style="background: #f8fafc; border: 1px dashed #94a3b8;"></td>
        <td></td>
        <td></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
