<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تذكرة مطبخ KDS - {{ order_number }}</title>
  <style>
    @page { size: 80mm auto; margin: 2mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 76mm; margin: 0 auto; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 13px; color: #000; line-height: 1.3; }
    .header { text-align: center; border-bottom: 2px dashed #000; padding-bottom: 6px; margin-bottom: 6px; }
    .num { font-family: 'Courier New', monospace; font-weight: 700; direction: ltr; }
    .table-box { border: 2px solid #000; font-size: 20px; font-weight: 900; text-align: center; padding: 6px; margin: 6px 0; }
    .item-row { margin-bottom: 8px; border-bottom: 1px dotted #666; padding-bottom: 4px; }
    .item-title { font-size: 15px; font-weight: 800; display: flex; justify-content: space-between; }
    .item-modifier { font-size: 11px; margin-right: 12px; font-weight: 600; color: #222; }
    .footer { text-align: center; font-size: 10px; margin-top: 10px; border-top: 1px dashed #000; padding-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-size: 16px; font-weight: 900;">*** تذكرة تشغيل المطبخ ***</div>
    <div style="font-size: 11px;">النوع: <strong>{{ order_type }}</strong> | النادل: {{ waiter_name }}</div>
    <div style="font-size: 11px;">الوقت: <span class="num">{{ order_time }}</span></div>
  </div>

  <div class="table-box">
    طاولة رقم {{ table_number }} ({{ dining_section }})
  </div>

  <div class="item-row">
    <div class="item-title">
      <span>{{ item_1_name }}</span>
      <span class="num">× {{ item_1_qty }}</span>
    </div>
    <div class="item-modifier">↳ ملاحظات: {{ item_1_notes }}</div>
  </div>

  <div class="footer">
    طلب رقم <span class="num">#{{ order_number }}</span>
  </div>
</body>
</html>
