<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إيصال حراري 58mm</title>
  <style>
    @page { size: 58mm auto; margin: 1mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 52mm; margin: 0 auto; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 10px; color: #000; line-height: 1.2; }
    .center { text-align: center; }
    .num { font-family: 'Courier New', monospace; font-weight: 600; text-align: left; direction: ltr; }
    .store-name { font-size: 13px; font-weight: 900; }
    .divider { border-bottom: 1px dashed #000; margin: 4px 0; }
    .row { display: flex; justify-content: space-between; font-size: 9px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="center">
    <div class="store-name">{{ company_name }}</div>
    <div style="font-size: 8px;">{{ company_phone }}</div>
  </div>
  <div class="divider"></div>
  <div class="row"><span>فاتورة:</span><span class="num">#{{ receipt_number }}</span></div>
  <div class="row"><span>التاريخ:</span><span class="num">{{ print_datetime }}</span></div>
  <div class="divider"></div>
  <div class="row" style="font-weight: 700;"><span>{{ item_1_name }}</span><span class="num">{{ item_1_total }}</span></div>
  <div style="font-size: 8px; color: #333;">الكمية: <span class="num">{{ item_1_qty }}</span> × <span class="num">{{ item_1_price }}</span></div>
  <div class="divider"></div>
  <div class="row" style="font-size: 12px; font-weight: 900;"><span>الإجمالي:</span><span class="num">{{ grand_total }} {{ currency }}</span></div>
  <div class="divider"></div>
  <div class="center" style="font-size: 8px;">شكراً لتشريفكم</div>
</body>
</html>
